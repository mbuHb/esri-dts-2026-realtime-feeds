<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StreamLayer with the Maps SDK for JavaScript</title>
    <script type="module" src="https://js.arcgis.com/5.1/"></script>
    <script type="module" src="app.js"></script>
    <!-- Syntax highlighting for the code viewer -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
      html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
      #viewContainer, arcgis-map, arcgis-scene { height: 100%; }
      .overlay { position: absolute; z-index: 1; }
      .badge {
        top: 15px; right: 15px; background: #b00020; color: #fff; font-weight: bold;
        letter-spacing: .08em; padding: 6px 12px; border-radius: 4px;
      }
      .panel {
        top: 15px; left: 15px; width: 290px; background: #fff; color: #222; padding: 12px 14px;
        border-radius: 6px; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); font-size: 14px;
        max-height: calc(100% - 60px); overflow-y: auto;
      }
      .panel h1 { font-size: 16px; margin: 0 0 8px; }
      .panel h2 { font-size: 13px; margin: 14px 0 6px; color: #555; text-transform: uppercase; letter-spacing: .05em; }
      .panel input, .panel select { width: 100%; box-sizing: border-box; padding: 5px; font-size: 13px; }
      .panel label.check { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: #222; }
      .panel label.check input { width: auto; margin: 0; }
      .row { display: flex; gap: 6px; margin-top: 6px; }
      .row > * { flex: 1; }
      button { padding: 6px 4px; cursor: pointer; font-size: 13px; }
      button[aria-pressed="true"], button.primary { background: #0079c1; color: #fff; border: 1px solid #0079c1; }
      .fallback { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ccc; color: #555; font-size: 12px; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; }
      dt { color: #555; }
      dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
      .key { display: flex; gap: 10px; margin-top: 8px; font-size: 12px; color: #555; }
      .key span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 4px; background: var(--c); }
      dialog { width: min(900px, 92vw); max-height: 85vh; border: none; border-radius: 8px; padding: 0; overflow: hidden; }
      dialog header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e1e1e; color: #fff; }
      dialog pre { margin: 0; background: #1e1e1e; overflow: auto; max-height: calc(85vh - 50px); }
      dialog pre code.hljs { padding: 16px; font: 14px/1.5 Consolas, monospace; }
    </style>
  </head>
  <body>
    <div id="viewContainer"></div>

    <div class="overlay badge">SIMULATED DATA</div>

    <div class="overlay panel">
      <h1>StreamLayer</h1>

      <h2>Data source</h2>
      <label for="serviceUrl">Stream service URL</label>
      <input id="serviceUrl" type="url" placeholder="https://…/StreamServer" />
      <div class="row"><button id="connect" class="primary">Connect</button></div>
      <div class="fallback">
        Fallback: local simulator
        <div class="row">
          <select id="localFeed" aria-label="Local feed">
            <option value="vehicles">Vehicles</option>
            <option value="drones">Drones</option>
          </select>
          <button id="useLocal">Use local</button>
        </div>
      </div>

      <h2>Status</h2>
      <dl>
        <dt>Source</dt><dd id="sourceLabel">—</dd>
        <dt>Connection</dt><dd id="status">—</dd>
        <dt>Received</dt><dd id="received">0</dd>
        <dt>On the map</dt><dd id="drawn">0</dd>
      </dl>

      <h2>View</h2>
      <div class="row">
        <button data-dimension="2d" aria-pressed="true">2D</button>
        <button data-dimension="3d">3D</button>
      </div>
      <label for="display" style="display:block;margin-top:8px">Display</label>
      <select id="display">
        <option value="latest">Latest position only</option>
        <option value="all">Keep everything (no purging)</option>
      </select>
      <label class="check"><input type="checkbox" id="tracks" /> Show tracks (beta) <small id="tracksNote" hidden>— 2D only</small></label>

      <h2>Filter</h2>
      <div class="row">
        <button data-filter="all" aria-pressed="true">All</button>
        <button data-filter="moving">Moving</button>
        <button data-filter="oldtown">Old town</button>
      </div>
      <div class="key">
        <span style="--c:#8c8c8c">Stopped</span>
        <span style="--c:#e8a200">Slow</span>
        <span style="--c:#1a7f37">Fast</span>
      </div>

      <div class="row" style="margin-top:14px"><button id="showCode">Show code</button></div>
    </div>

    <dialog id="codeDialog">
      <header>
        <strong>streamlayer.js</strong>
        <form method="dialog"><button>Close</button></form>
      </header>
      <pre><code id="code" class="language-javascript"></code></pre>
    </dialog>
  </body>
</html>
